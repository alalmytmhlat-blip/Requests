name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Generate Android platform files when this repository has only Dart source.
      - name: Generate Android platform project if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --platforms=android --project-name requests_app --org com.requests
          fi
      # Use the requested Arabic app name in the installed Android launcher.
      - name: Set Android application label
        run: |
          sed -i 's/android:label="requests_app"/android:label="طلبات"/' android/app/src/main/AndroidManifest.xml
      - name: Add Bluetooth permissions
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
      # Patch legacy nearby_connections Android repository for modern Gradle.
      - name: Patch Android Gradle compatibility
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' "$HOME/.pub-cache/hosted/pub.dev/nearby_connections-3.3.1/android/build.gradle"
          echo 'android.newDsl=false' >> android/gradle.properties
      - run: flutter pub get
      - name: Generate app icon artwork
        run: |
          python -m pip install --quiet pillow
          python tool/generate_app_icon.py
      - name: Apply Android launcher icon
        run: dart run flutter_launcher_icons
      # Analyzer infos are non-blocking; errors and warnings still fail the build.
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: requests-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
