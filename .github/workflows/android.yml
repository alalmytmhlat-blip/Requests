name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # This repository initially contains Dart source but no Android host
      # project. Generate the Android platform files before compiling.
      - name: Generate Android platform project if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --platforms=android --project-name requests_app --org com.requests
          fi
      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: requests-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
